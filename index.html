<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M4: Art, Technology and Impact — Workload Chart</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Patrick Hand', 'Comic Sans MS', cursive;
  background: #fff;
  color: #222;
  padding: 20px 16px;
}
h1 {
  font-size: 17px;
  font-weight: 600;
  color: #111827;
  margin-bottom: 14px;
}
#controls { display: flex; gap: 8px; margin-bottom: 12px; }
#chart-wrap { overflow-x: auto; }
#chart { width: 100%; min-width: 480px; max-width: 880px; display: block; }
#legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 16px;
  font-size: 15px;
}
#tooltip {
  display: none;
  position: fixed;
  width: 270px;
  background: #fffef5;
  border: 2px solid #333;
  border-radius: 6px;
  box-shadow: 3px 3px 0 rgba(0,0,0,.15);
  padding: 10px 14px;
  font-family: 'Patrick Hand', 'Comic Sans MS', cursive;
  font-size: 14px;
  pointer-events: none;
  z-index: 9999;
}
</style>
</head>
<body>
<h1>M4: Art, Technology and Impact</h1>
<div id="controls"></div>
<div id="chart-wrap">
  <svg id="chart"
    viewBox="0 0 880 520"
    font-family="Patrick Hand, Comic Sans MS, cursive">
  </svg>
</div>
<div id="legend"></div>
<div id="tooltip"></div>
<script>
const STATE = {"moduleName":"M4: Art, Technology and Impact","numWeeks":11,"startDate":"2026-04-20","courses":[{"id":"c1","name":"Art [&&] Impact","color":"#9B59B6","ecs":5},{"id":"c2","name":"Design for Experience","color":"#E67E22","ecs":3},{"id":"c3","name":"Algorithms","color":"#3498DB","ecs":3},{"id":"c4","name":"Statistics","color":"#27AE60","ecs":3},{"id":"c5","name":"ProfDev","color":"#F06292","ecs":1}],"weeklyTotals":{"c1":[{"sched":10,"home":2},{"sched":3.5,"home":2},{"sched":9,"home":3},{"sched":3.5,"home":3},{"sched":6,"home":2},{"sched":5.5,"home":2},{"sched":6,"home":2},{"sched":10.5,"home":2},{"sched":7,"home":2.5},{"sched":25,"home":3},{"sched":23.5,"home":7}],"c2":[{"sched":4,"home":5},{"sched":4,"home":3},{"sched":1,"home":9},{"sched":2,"home":5},{"sched":4,"home":7},{"sched":4,"home":6},{"sched":3,"home":6},{"sched":1,"home":4},{"sched":2,"home":4},{"sched":1,"home":7},{"sched":0,"home":0}],"c3":[{"sched":7,"home":2},{"sched":7,"home":6.5},{"sched":7,"home":2},{"sched":3.5,"home":4},{"sched":7,"home":3},{"sched":3.5,"home":4},{"sched":7,"home":2},{"sched":3.5,"home":8},{"sched":1,"home":2},{"sched":0,"home":0},{"sched":0,"home":0}],"c4":[{"sched":4,"home":4},{"sched":4,"home":4},{"sched":3.5,"home":4},{"sched":4,"home":9},{"sched":5,"home":3},{"sched":5.5,"home":6},{"sched":6,"home":6},{"sched":3,"home":9},{"sched":1,"home":0},{"sched":0,"home":0},{"sched":0,"home":0}],"c5":[{"sched":2,"home":0},{"sched":3.5,"home":2.5},{"sched":0,"home":1.5},{"sched":3.5,"home":2.5},{"sched":0,"home":3},{"sched":3.5,"home":0},{"sched":0,"home":2},{"sched":0,"home":2},{"sched":2,"home":0},{"sched":0,"home":0},{"sched":0,"home":0}]}};
/**
 * Vanilla-JS runtime for the self-contained student-view export.
 * Loaded via Vite's `?raw` import and embedded verbatim inside a <script> tag.
 * Assumes a global STATE object is already defined before this script runs.
 * No `export` — intentionally not an ES module.
 */

/* global STATE */
const { moduleName, numWeeks, startDate, courses, weeklyTotals } = STATE;

// ── Chart constants (must match React source) ─────────────────────
const VB_W = 880, VB_H = 520, ML = 54, MR = 20, MT = 28, MB = 88;
const CHART_W = VB_W - ML - MR;
const CHART_H = VB_H - MT - MB;
const TIP_W = 270, TIP_ROW_H = 24, TIP_HEADER_H = 42, TIP_PAD = 20;

// ── App state ─────────────────────────────────────────────────────
let viewMode = 'both';       // 'both' | 'sched' | 'home'
let filteredCourse = null;   // course id string | null
let hoverWi = null;          // week index (0-based) | null
let mouseX = 0, mouseY = 0;

// ── Wiggle (verbatim from wiggle.js, minus `export`) ──────────────
function srand(seed) {
  let s = (seed | 0) || 1;
  return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}
function wigglePath(x1, y1, x2, y2, amp, steps, rng) {
  const dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy) || 1;
  const px = -dy / len, py = dx / len;
  let d = `M ${x1.toFixed(2)} ${y1.toFixed(2)}`;
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    const nx = x1 + dx * t + px * amp * (rng() - 0.5) * 2 * Math.sin(t * Math.PI);
    const ny = y1 + dy * t + py * amp * (rng() - 0.5) * 2 * Math.sin(t * Math.PI);
    d += ` L ${nx.toFixed(2)} ${ny.toFixed(2)}`;
  }
  return d;
}
function wigglyRect(x, y, w, h, seed) {
  if (w <= 0 || h <= 0) return null;
  const rng = srand(seed * 137 + 41);
  const amp = 1.4;
  const steps = Math.max(3, Math.floor(Math.max(w, h) / 8));
  const strip = p => p.replace(/^M[^L]*L/, 'L');
  const top    = wigglePath(x,     y,     x + w, y,     amp, steps, rng);
  const right  = wigglePath(x + w, y,     x + w, y + h, amp, steps, rng);
  const bottom = wigglePath(x + w, y + h, x,     y + h, amp, steps, rng);
  const left   = wigglePath(x,     y + h, x,     y,     amp, steps, rng);
  return top + strip(right) + strip(bottom) + strip(left) + ' Z';
}

// ── Date helpers (verbatim from dateHelpers.js, minus `export`) ───
function parseDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function addDays(date, n) {
  const d = new Date(date); d.setDate(d.getDate() + n); return d;
}
function isoWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
}
function weekMonday(sd, wi) { return addDays(parseDate(sd), wi * 7); }

// ── Derived helpers ───────────────────────────────────────────────
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function getGroupW() { return CHART_W / numWeeks; }
function getBarW()   { return getGroupW() * 0.58; }
function getBarX0()  { return (getGroupW() - getBarW()) / 2; }
function yPx(h, yMax) { return MT + CHART_H - (h / yMax) * CHART_H; }
function weekCx(wi)  { return ML + wi * getGroupW() + getGroupW() / 2; }
function showSched() { return viewMode !== 'home'; }
function showHome()  { return viewMode !== 'sched'; }

function computeMaxHours() {
  let max = 0;
  for (let w = 0; w < numWeeks; w++) {
    let t = 0;
    courses.forEach(c => {
      const wk = weeklyTotals[c.id][w];
      if (showSched()) t += wk.sched;
      if (showHome())  t += wk.home;
    });
    if (t > max) max = t;
  }
  return max;
}

function computeCourseTotals() {
  return Object.fromEntries(courses.map(c => [
    c.id,
    weeklyTotals[c.id].reduce((s, wk) => s + (showSched() ? wk.sched : 0) + (showHome() ? wk.home : 0), 0),
  ]));
}

// ── SVG building ──────────────────────────────────────────────────
function buildDefs() {
  return '<defs>' + courses.map(c =>
    `<pattern id="hatch-${c.id}" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">` +
    `<rect width="4" height="4" fill="${c.color}" fill-opacity="0.5"/>` +
    `<line x1="0" y1="0" x2="0" y2="4" stroke="${c.color}" stroke-width="1.8"/>` +
    `</pattern>`
  ).join('') + '</defs>';
}

function buildStatic(yMax, yStep) {
  const rng  = srand(42);
  const axX  = wigglePath(ML, MT + CHART_H, ML + CHART_W, MT + CHART_H, 1.2, 20, rng);
  const axY  = wigglePath(ML, MT + CHART_H, ML, MT, 1.2, 20, rng);
  const xArr = `${ML + CHART_W},${MT + CHART_H - 5} ${ML + CHART_W + 8},${MT + CHART_H} ${ML + CHART_W},${MT + CHART_H + 5}`;
  const yArr = `${ML - 5},${MT} ${ML},${MT - 8} ${ML + 5},${MT}`;

  let html = '';
  for (let h = 0; h <= yMax; h += yStep) {
    const py = yPx(h, yMax);
    html += `<line x1="${ML}" y1="${py}" x2="${ML + CHART_W}" y2="${py}" stroke="#d1d5db" stroke-width="0.8" stroke-dasharray="4 4"/>`;
    html += `<text x="${ML - 6}" y="${py + 4}" text-anchor="end" font-size="14" fill="#555">${h}h</text>`;
  }
  html += `<path d="${axX}" fill="none" stroke="#222" stroke-width="2.8"/>`;
  html += `<path d="${axY}" fill="none" stroke="#222" stroke-width="2.8"/>`;
  html += `<polygon points="${xArr}" fill="#222"/>`;
  html += `<polygon points="${yArr}" fill="#222"/>`;
  html += `<text x="${ML + CHART_W / 2}" y="${VB_H - 10}" text-anchor="middle" font-size="16" fill="#333" font-weight="600">Module week</text>`;
  html += `<text x="0" y="0" transform="translate(13,${MT + CHART_H / 2}) rotate(-90)" text-anchor="middle" font-size="16" fill="#333" font-weight="600">hours / week</text>`;
  return html;
}

function buildXLabels() {
  const gw = getGroupW();
  return Array.from({ length: numWeeks }, (_, wi) => {
    const bold = hoverWi === wi;
    return (
      `<g data-wi="${wi}">` +
      `<rect x="${ML + wi * gw}" y="${MT + CHART_H}" width="${gw}" height="${MB - 10}" fill="transparent"/>` +
      `<text x="${weekCx(wi)}" y="${MT + CHART_H + 22}" text-anchor="middle" font-size="14"` +
      ` fill="${bold ? '#111' : '#444'}" font-weight="${bold ? 700 : 400}">${wi + 1}</text>` +
      `</g>`
    );
  }).join('');
}

function buildBars(yMax) {
  const gw = getGroupW(), bw = getBarW(), bx0 = getBarX0();
  return Array.from({ length: numWeeks }, (_, wi) => {
    let stackY = MT + CHART_H, groupTotal = 0, segs = '';
    courses.forEach((c, ci) => {
      const wk   = weeklyTotals[c.id][wi];
      const sched = showSched() ? (wk.sched || 0) : 0;
      const home  = showHome()  ? (wk.home  || 0) : 0;
      groupTotal += sched + home;
      const op = (filteredCourse !== null && filteredCourse !== c.id) ? 0.11 : 1;
      const bx = ML + wi * gw + bx0;
      if (sched > 0) {
        const segH = (sched / yMax) * CHART_H;
        const sy = stackY - segH;
        const path = wigglyRect(bx, sy, bw, segH, wi * 1000 + ci * 10 + 1);
        if (path) segs += `<path d="${path}" fill="${c.color}" stroke="${c.color}" stroke-width="1.2" opacity="${op}"/>`;
        stackY = sy;
      }
      if (home > 0) {
        const segH = (home / yMax) * CHART_H;
        const sy = stackY - segH;
        const path = wigglyRect(bx, sy, bw, segH, wi * 1000 + ci * 10 + 2);
        if (path) segs += `<path d="${path}" fill="url(#hatch-${c.id})" stroke="${c.color}" stroke-width="1.2" opacity="${op}"/>`;
        stackY = sy;
      }
    });
    // Full-column transparent hit area — data-wi on the <g> covers all children
    segs += `<rect x="${ML + wi * gw}" y="${MT}" width="${gw}" height="${CHART_H}" fill="transparent"/>`;
    if (hoverWi === wi && groupTotal > 0) {
      const labelY = Math.min(stackY - 6, MT + CHART_H - 4);
      segs += `<text x="${weekCx(wi)}" y="${labelY}" text-anchor="middle" font-size="14" font-weight="700" fill="#111" pointer-events="none">${groupTotal}h</text>`;
    }
    return `<g data-wi="${wi}">${segs}</g>`;
  }).join('');
}

function renderSVG() {
  const maxHours = computeMaxHours();
  const yMax  = Math.ceil((maxHours + 5) / 5) * 5 || 20;
  const yStep = yMax <= 20 ? 5 : yMax <= 40 ? 10 : 15;
  document.getElementById('chart').innerHTML =
    buildDefs() + buildStatic(yMax, yStep) + buildXLabels() + buildBars(yMax);
}

// ── Tooltip ───────────────────────────────────────────────────────
function updateTooltip() {
  const tip = document.getElementById('tooltip');
  if (hoverWi === null) { tip.style.display = 'none'; return; }

  const wi = hoverWi;
  const breakdown = courses.map(c => ({
    ...c,
    sched: showSched() ? (weeklyTotals[c.id][wi]?.sched || 0) : 0,
    home:  showHome()  ? (weeklyTotals[c.id][wi]?.home  || 0) : 0,
  })).filter(c => c.sched > 0 || c.home > 0);

  const total = breakdown.reduce((s, c) => s + c.sched + c.home, 0);
  if (!total) { tip.style.display = 'none'; return; }

  const wkLabel = `W${wi + 1}${startDate ? ` \u00b7 CW${isoWeek(weekMonday(startDate, wi))}` : ''}`;

  tip.innerHTML =
    `<div style="font-weight:700;margin-bottom:8px;font-size:15px">${wkLabel} \u2014 ${total}h total</div>` +
    breakdown.map(c => {
      const hrs = [c.sched > 0 && `${c.sched}h`, c.home > 0 && `${c.home}h`].filter(Boolean).join(' + ');
      const dim = filteredCourse !== null && filteredCourse !== c.id;
      return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:3px;opacity:${dim ? 0.35 : 1}">` +
        `<span style="width:8px;height:8px;border-radius:50%;background:${c.color};flex-shrink:0;display:inline-block"></span>` +
        `<span style="flex:1;color:#333">${esc(c.name || 'Unnamed')}</span>` +
        `<span style="color:#555;white-space:nowrap">${hrs}</span>` +
        `</div>`;
    }).join('');

  const tipH = TIP_HEADER_H + breakdown.length * TIP_ROW_H + 16;
  const left = mouseX + TIP_W + TIP_PAD < window.innerWidth  ? mouseX + 16 : mouseX - TIP_W - 12;
  const top  = mouseY + tipH  + TIP_PAD < window.innerHeight ? mouseY + 8  : mouseY - tipH - 8;
  tip.style.left    = left + 'px';
  tip.style.top     = top  + 'px';
  tip.style.display = 'block';
}

// ── Legend ────────────────────────────────────────────────────────
function updateLegend() {
  const totals = computeCourseTotals();
  const el = document.getElementById('legend');
  el.innerHTML = '';
  courses.forEach(c => {
    const total  = totals[c.id] || 0;
    const active = filteredCourse === c.id;
    const div    = document.createElement('div');
    div.style.cssText =
      'display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 8px;border-radius:5px;' +
      'user-select:none;transition:opacity 0.15s;' +
      `border:${active ? `2px solid ${c.color}` : '2px solid transparent'};` +
      `background:${active ? c.color + '12' : 'transparent'};` +
      `opacity:${filteredCourse !== null && !active ? 0.4 : 1};`;
    div.innerHTML =
      `<svg width="12" height="12"><rect width="12" height="12" fill="${c.color}"/></svg>` +
      `<svg width="12" height="12"><defs>` +
      `<pattern id="leg-${c.id}" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">` +
      `<rect width="4" height="4" fill="${c.color}" fill-opacity="0.5"/>` +
      `<line x1="0" y1="0" x2="0" y2="4" stroke="${c.color}" stroke-width="1.8"/>` +
      `</pattern></defs><rect width="12" height="12" fill="url(#leg-${c.id})" stroke="${c.color}" stroke-width="1"/></svg>` +
      `<span style="color:#222">${esc(c.name || 'Unnamed')}</span>` +
      `<span style="color:#666">(${total}h)</span>`;
    div.addEventListener('click', () => {
      filteredCourse = active ? null : c.id;
      update();
    });
    el.appendChild(div);
  });
}

// ── Filter buttons ────────────────────────────────────────────────
function updateButtons() {
  const el = document.getElementById('controls');
  el.innerHTML = '';
  [
    { mode: 'sched', label: 'Class time only', icon: 'solid' },
    { mode: 'home',  label: 'Home time only',  icon: 'hatch' },
  ].forEach(({ mode, label, icon }) => {
    const active = viewMode === mode;
    const ic = active ? '#374151' : '#9ca3af';
    const btn = document.createElement('button');
    btn.style.cssText =
      'display:flex;align-items:center;gap:7px;height:34px;padding:0 14px;' +
      `border:${active ? '1.5px solid #374151' : '1px solid #d1d5db'};` +
      `border-radius:6px;background:${active ? '#e5e7eb' : '#fff'};` +
      `cursor:pointer;font-size:13px;font-family:inherit;` +
      `font-weight:${active ? 600 : 400};color:${active ? '#111827' : '#6b7280'};`;
    const iconSvg = icon === 'solid'
      ? `<svg width="12" height="12" style="flex-shrink:0"><rect width="12" height="12" fill="${ic}"/></svg>`
      : `<svg width="12" height="12" style="flex-shrink:0">` +
        `<defs><pattern id="btn-hatch-${mode}" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">` +
        `<rect width="4" height="4" fill="${ic}" fill-opacity="0.5"/>` +
        `<line x1="0" y1="0" x2="0" y2="4" stroke="${ic}" stroke-width="1.8"/>` +
        `</pattern></defs><rect width="12" height="12" fill="url(#btn-hatch-${mode})" stroke="${ic}" stroke-width="1"/>` +
        `</svg>`;
    btn.innerHTML = iconSvg + label;
    btn.addEventListener('click', () => {
      viewMode = viewMode === mode ? 'both' : mode;
      update();
    });
    el.appendChild(btn);
  });
}

// ── Full update cycle ─────────────────────────────────────────────
function update() {
  renderSVG();
  updateTooltip();
  updateLegend();
  updateButtons();
}

// ── SVG event delegation (set once — survives innerHTML re-renders) ─
function getWi(e) {
  let el = e.target;
  const svg = document.getElementById('chart');
  while (el && el !== svg) {
    if (el.hasAttribute('data-wi')) return +el.getAttribute('data-wi');
    el = el.parentElement;
  }
  return null;
}

const chartSvg = document.getElementById('chart');
chartSvg.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  const wi = getWi(e);
  if (wi !== hoverWi) { hoverWi = wi; renderSVG(); }
  updateTooltip();
});
chartSvg.addEventListener('mouseleave', () => {
  hoverWi = null;
  renderSVG();
  updateTooltip();
});

update();

</script>
</body>
</html>
